name: Apply event removals

# The desk crosses events off on the dashboard, presses "Remove these", and
# submits the GitHub issue that opens pre-filled. This commits what the issue
# asks for into data/exclusions.yaml and closes it.
#
# Routing through an issue rather than the GitHub API from the page means no
# access token has to live in a browser, and the issue is a durable record of
# who removed what and when.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-exclusions      # serialise, so two reviewers cannot race the file
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.issue.labels.*.name, 'drop-events')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Merge the requested removals into data/exclusions.yaml
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: python tools/apply_exclusions.py

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- data/exclusions.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exclusions.yaml
          git commit -m "Remove ${{ steps.merge.outputs.added }} event(s) from the calendar (#${{ github.event.issue.number }})

          Requested by @${{ github.event.issue.user.login }} via the dashboard."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Reply and close
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const added = "${{ steps.merge.outputs.added }}" || "0";
            const err = `${{ steps.merge.outputs.error }}`;
            const ok = "${{ steps.commit.outputs.changed }}" === "true";
            let body;
            if (err && err !== "") {
              body = `Could not apply this: ${err}\n\nNothing was changed. ` +
                     `Fix the block above and reopen, or edit ` +
                     `\`data/exclusions.yaml\` directly.`;
            } else if (!ok) {
              body = `Those events were already excluded - nothing to change.`;
            } else {
              body = `Done: ${added} event(s) added to \`data/exclusions.yaml\`.\n\n` +
                     `The site rebuilds in a few minutes and they will be gone from ` +
                     `the dashboard and every .ics feed. Outlook picks it up on its ` +
                     `next refresh, which is on Outlook's schedule (usually a few hours).`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            if (!err) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
            }
