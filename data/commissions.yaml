# Registry of US utility regulatory commissions.
#
# Each entry drives the scrape engine. `sources` is a list of calendar pages;
# the engine scrapes EVERY one of them and merges the results, de-duplicating by
# (commission, date, title). More sources is strictly better - commissions
# routinely split open meetings, evidentiary hearings and local public hearings
# across separate pages, and a page that adds nothing new costs one cached fetch.
# If you find another page listing dates, add it; do not worry about overlap.
#
# strategy values:
#   auto        - probe for .ics link, RSS <link rel=alternate>, Tribe/Drupal JSON API,
#                 then fall back to HTML card/table parsing, then date-regex.
#   ics         - the URL is (or serves) an iCalendar feed
#   rss         - the URL is an RSS/Atom feed
#   tribe       - WordPress "The Events Calendar" REST API
#   drupal      - Drupal JSON:API or Views REST export
#   html        - parse HTML with the selectors in `selectors`
#   date_regex  - last resort: pull dates out of page text with surrounding context
#
# `tier: core` = a state where at least one covered ticker is regulated. These get
# scraped every run and failures page loudly. `tier: full` states are still scraped
# but a failure is a warning, not an error.

commissions:

  # ---------------------------------------------------------------- FEDERAL
  - code: FERC
    name: Federal Energy Regulatory Commission
    state: US
    type: federal
    tier: core
    timezone: America/New_York
    home: https://www.ferc.gov
    docket_search: https://elibrary.ferc.gov/eLibrary/search
    sources:
      # RE-AUDITED 2026-08-14: ferc.gov WAF-blocks every automated client
      # (403 to tool, compat and browser UAs alike). The two ferc.gov URLs
      # are kept so the health panel shows the block honestly and recovers
      # automatically if FERC ever lifts it.
      # VERIFIED WORKING 2026-08-14: the Federal Register API carries FERC's
      # Sunshine Act meeting notices with the actual meeting date/time in the
      # `dates` field. Notices post ~2 days before each meeting, so this
      # yields the next Open Commission Meeting, not a long-horizon calendar.
      - url: "https://www.federalregister.gov/api/v1/documents.json?per_page=20&order=newest&conditions%5Bagencies%5D%5B%5D=federal-energy-regulatory-commission&conditions%5Btype%5D%5B%5D=NOTICE&conditions%5Bterm%5D=%22sunshine%20act%22&fields%5B%5D=title&fields%5B%5D=publication_date&fields%5B%5D=dates&fields%5B%5D=abstract&fields%5B%5D=html_url"
        strategy: federal_register
      - url: https://www.ferc.gov/news-events/events
        strategy: auto
      - url: https://www.ferc.gov/media/commission-meeting-calendar
        strategy: auto
    notes: >-
      Open Commission Meetings are generally the third Thursday monthly. Matters for
      transmission ROE, formula rate updates and merger approvals for AEP, ETR, PCG,
      PEG, PNW, SO, SRE land here rather than at a state commission.

