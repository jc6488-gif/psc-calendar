      - { name: Evergy Kansas South, commissions: [KS] }
      - { name: Evergy Metro, commissions: [KS, MO] }
      - { name: Evergy Missouri West, commissions: [MO] }
    match: ["Evergy", "Westar", "Kansas City Power", "KCP&L", "Kansas Gas and Electric"]

  - ticker: HE
    name: Hawaiian Electric Industries
    sector: Electric
    subsidiaries:
      - { name: Hawaiian Electric Company, abbr: HECO, commissions: [HI] }
      - { name: Hawaii Electric Light Company, abbr: HELCO, commissions: [HI] }
      - { name: Maui Electric Company, abbr: MECO, commissions: [HI] }
    match: ["Hawaiian Electric", "Hawaii Electric Light", "Maui Electric", "HECO", "HELCO", "MECO"]

  - ticker: LNT
