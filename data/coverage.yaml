# Coverage universe: ticker -> regulated operating companies -> commissions.
#
# `match` strings are used to attribute a scraped calendar event to a ticker.
# They are matched case-insensitively against the event title, description and
# docket number. Keep them specific enough not to false-positive: "Southern"
# alone would match "Southern California Edison", so use "Southern Company".
#
# `aliases` are additional name forms that appear in commission filings.
# `dockets` optionally pins known active proceedings for tighter matching.

companies:

  - ticker: AEP
    name: American Electric Power
    sector: Electric
    subsidiaries:
      - { name: Appalachian Power Company, abbr: APCo, commissions: [VA, WV, TN] }
      - { name: Wheeling Power Company, commissions: [WV] }
      - { name: Indiana Michigan Power Company, abbr: I&M, commissions: [IN, MI] }
      - { name: Kentucky Power Company, commissions: [KY] }
      - { name: Ohio Power Company, abbr: AEP Ohio, commissions: [OH] }
      - { name: Public Service Company of Oklahoma, abbr: PSO, commissions: [OK] }
      - { name: Southwestern Electric Power Company, abbr: SWEPCO, commissions: [AR, LA, TX] }
      - { name: AEP Texas Inc., commissions: [TX] }
      - { name: AEP Transmission Company, commissions: [FERC] }
    match: ["American Electric Power", "AEP Ohio", "AEP Texas", "Appalachian Power", "APCo",
            "Wheeling Power", "Indiana Michigan Power", "Kentucky Power", "Ohio Power Company",
            "Public Service Company of Oklahoma", "Southwestern Electric Power", "SWEPCO",
            "AEP Transmission"]

  - ticker: ATO
    name: Atmos Energy
    sector: Gas LDC
    subsidiaries:
      - { name: Atmos Energy Mid-Tex Division, commissions: [TX-RRC] }
      - { name: Atmos Energy West Texas Division, commissions: [TX-RRC] }
      - { name: Atmos Energy Louisiana, commissions: [LA] }
      - { name: Atmos Energy Mississippi, commissions: [MS] }
      - { name: Atmos Energy Tennessee, commissions: [TN] }
      - { name: Atmos Energy Kentucky, commissions: [KY] }
      - { name: Atmos Energy Colorado, commissions: [CO] }
      - { name: Atmos Energy Kansas, commissions: [KS] }
      - { name: Atmos Energy Virginia, commissions: [VA] }
    match: ["Atmos Energy", "Atmos", "Mid-Tex"]
    notes: >-
      Texas gas rates are set both at the Railroad Commission and by ~440 individual
      city rate jurisdictions under the RRM/GRIP mechanisms. City dates are not
      centrally published; the RRC calendar catches appeals and statewide dockets only.

  - ticker: BKH
    name: Black Hills Corporation
    sector: Electric + Gas
    subsidiaries:
      - { name: Black Hills Power, commissions: [SD, WY, MT] }
      - { name: Cheyenne Light Fuel and Power, commissions: [WY] }
      - { name: Black Hills Colorado Electric, commissions: [CO] }
      - { name: Black Hills Energy Colorado Gas, commissions: [CO] }
      - { name: Black Hills Energy Iowa Gas, commissions: [IA] }
      - { name: Black Hills Energy Kansas Gas, commissions: [KS] }
      - { name: Black Hills Energy Nebraska Gas, commissions: [NE] }
      - { name: Black Hills Energy Arkansas Gas, commissions: [AR] }
      - { name: Black Hills Energy Wyoming Gas, commissions: [WY] }
    match: ["Black Hills", "Cheyenne Light"]

  - ticker: CNP
    name: CenterPoint Energy
    sector: Electric + Gas
    subsidiaries:
      - { name: CenterPoint Energy Houston Electric, commissions: [TX] }
      - { name: CenterPoint Energy Resources Texas Gas, commissions: [TX-RRC] }
      - { name: CenterPoint Energy Indiana South (SIGECO), commissions: [IN] }
      - { name: CenterPoint Energy Indiana North, commissions: [IN] }
      - { name: CenterPoint Energy Ohio Gas, commissions: [OH] }
      - { name: CenterPoint Energy Minnesota Gas, commissions: [MN] }
    match: ["CenterPoint", "Houston Electric", "SIGECO", "Southern Indiana Gas", "Vectren"]
    notes: The Louisiana and Mississippi gas LDCs were divested in 2025 - legacy dockets in those states may still surface.

  - ticker: CPK
    name: Chesapeake Utilities Corporation
    sector: Gas + Electric
    subsidiaries:
      - { name: Chesapeake Utilities Delaware Division, commissions: [DE] }
      - { name: Chesapeake Utilities Maryland Division, commissions: [MD] }
      - { name: Chesapeake Utilities Florida, commissions: [FL] }
      - { name: Florida Public Utilities Company, abbr: FPU, commissions: [FL] }
      - { name: Aspire Energy of Ohio, commissions: [OH] }
      - { name: Chesapeake Utilities Virginia, commissions: [VA] }
    match: ["Chesapeake Utilities", "Florida Public Utilities", "Aspire Energy", "Sandpiper Energy",
            "Peninsula Pipeline", "Eastern Shore Natural Gas"]

  - ticker: DTE
    name: DTE Energy
    sector: Electric + Gas
    subsidiaries:
      - { name: DTE Electric Company, commissions: [MI] }
      - { name: DTE Gas Company, commissions: [MI] }
    match: ["DTE Electric", "DTE Gas", "DTE Energy", "Detroit Edison", "Michigan Consolidated Gas"]

  - ticker: ED
    name: Consolidated Edison
    sector: Electric + Gas + Steam
    subsidiaries:
      - { name: Consolidated Edison Company of New York, abbr: CECONY, commissions: [NY] }
      - { name: Orange and Rockland Utilities, abbr: O&R, commissions: [NY] }
      - { name: Rockland Electric Company, abbr: RECO, commissions: [NJ] }
    match: ["Consolidated Edison", "Con Edison", "CECONY", "Orange and Rockland",
            "Orange & Rockland", "Rockland Electric"]

  - ticker: EIX
    name: Edison International
    sector: Electric
    subsidiaries:
      - { name: Southern California Edison, abbr: SCE, commissions: [CA, FERC] }
    match: ["Southern California Edison", "SCE ", "Edison International"]

  - ticker: ETR
    name: Entergy Corporation
    sector: Electric + Gas
    subsidiaries:
