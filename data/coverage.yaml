      - { name: Spire Alabama, commissions: [AL] }
      - { name: Spire Gulf, commissions: [AL] }
      - { name: Spire Mississippi, commissions: [MS] }
    # Bare "Spire" is safe because matching is word-boundary anchored, so
    # "Spirent" cannot hit. Commission calendars very often name the party with
    # no corporate suffix ("Ginger v. Spire"), so omitting the bare form silently
    # dropped real Missouri dockets.
