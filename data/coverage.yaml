  - ticker: MGEE
    name: MGE Energy
    sector: Electric + Gas
    subsidiaries:
      - { name: Madison Gas and Electric Company, abbr: MGE, commissions: [WI] }
    match: ["Madison Gas and Electric", "Madison Gas & Electric", "MGE Energy"]

  - ticker: NI
    name: NiSource Inc.
    sector: Electric + Gas
    subsidiaries:
      - { name: Northern Indiana Public Service Company, abbr: NIPSCO, commissions: [IN] }
