      - { name: Entergy Louisiana, commissions: [LA] }
      - { name: Entergy Mississippi, commissions: [MS] }
      - { name: Entergy Texas, commissions: [TX] }
      - { name: Entergy New Orleans, commissions: [NOLA] }
      - { name: System Energy Resources Inc, abbr: SERI, commissions: [FERC] }
