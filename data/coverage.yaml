      - { name: Columbia Gas of Pennsylvania, commissions: [PA] }
      - { name: Columbia Gas of Virginia, commissions: [VA] }
      - { name: Columbia Gas of Kentucky, commissions: [KY] }
      - { name: Columbia Gas of Maryland, commissions: [MD] }
    match: ["NiSource", "NIPSCO", "Northern Indiana Public Service", "Columbia Gas"]

  - ticker: NWE
    name: NorthWestern Energy Group
    sector: Electric + Gas
    subsidiaries:
      - { name: NorthWestern Energy Montana, commissions: [MT] }
      - { name: NorthWestern Energy South Dakota, commissions: [SD] }
      - { name: NorthWestern Energy Nebraska, commissions: [NE] }
    match: ["NorthWestern Energy", "NorthWestern Corporation", "Northwestern Public Service"]

  - ticker: OGE
    name: OGE Energy Corp.
    sector: Electric
    subsidiaries:
      - { name: Oklahoma Gas and Electric Company, abbr: OG&E, commissions: [OK, AR] }
    match: ["Oklahoma Gas and Electric", "Oklahoma Gas & Electric", "OG&E", "OGE Energy"]

  - ticker: OGS
    name: ONE Gas Inc.
