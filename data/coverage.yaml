      - { name: Georgia Power Company, commissions: [GA] }
      - { name: Mississippi Power Company, commissions: [MS] }
      - { name: Nicor Gas, commissions: [IL] }
      - { name: Atlanta Gas Light Company, commissions: [GA] }
      - { name: Virginia Natural Gas, commissions: [VA] }
      - { name: Chattanooga Gas Company, commissions: [TN] }
      - { name: Southern Power Company, commissions: [FERC] }
