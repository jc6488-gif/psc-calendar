# ---------------------------------------------------------------------------
# Event classification. Ordered - first matching rule wins.
# `weight` drives sort priority in the dashboard: 3 = moves the model,
# 2 = worth watching, 1 = context.
event_types:
  - id: decision
    label: Decision / Order
    weight: 3
    patterns: ["open meeting", "voting meeting", "agenda conference", "administrative session",
               "business meeting", "commission meeting", "public meeting", "decision conference",
               "deliberation", "commission conference", "executive session", "agenda meeting",
               "public service commission session", "commission session", "work session",
               "special open meeting", "regular meeting"]

  - id: evidentiary_hearing
    label: Evidentiary Hearing
    weight: 3
    patterns: ["evidentiary hearing", "formal hearing", "contested case hearing",
               "hearing on the merits", "technical conference", "trial", "cross-examination",
               "rate hearing", "revenue requirement hearing"]

  - id: procedural
    label: Procedural Milestone
    weight: 3
    patterns: ["prehearing conference", "pre-hearing conference", "scheduling conference",
               "procedural schedule", "testimony due", "direct testimony", "rebuttal testimony",
               "surrebuttal", "intervention deadline", "petition to intervene", "briefs due",
               "initial brief", "reply brief", "settlement conference", "settlement discussion",
               "statutory deadline", "suspension period", "rate effective", "true-up",
               "comment deadline", "reply comments due"]

  - id: public_comment
    label: Public Comment Hearing
    weight: 2
    patterns: ["public comment", "public hearing", "public input", "listening session",
               "public forum", "customer hearing", "local public hearing", "town hall",
               "public witness", "community meeting"]

  - id: workshop
    label: Workshop / Conference
    weight: 1
    patterns: ["workshop", "roundtable", "stakeholder", "working group", "webinar",
               "informational", "training", "symposium", "task force", "advisory"]

  - id: other
    label: Other
    weight: 1
    patterns: []


# Keywords that mark an event as rate-case-relevant regardless of type.
rate_case_signals:
  - "rate case"
  - "general rate"
  - "base rate"
  - "revenue requirement"
  - "rate increase"
  - "rate adjustment"
  - "tariff"
  - "cost of capital"
  - "return on equity"
  - "rate of return"
  - "certificate of public convenience"
  - "integrated resource plan"
  - "resource plan"
  - "securitization"
  - "fuel adjustment"
  - "purchased gas adjustment"
  - "energy cost recovery"
  - "formula rate"
  - "rate review"
  - "rate stabilization"
  - "infrastructure surcharge"
  - "distribution system improvement"
  - "merger"
  - "acquisition"
  - "prudence"
  - "depreciation"
  - "test year"
  - "decoupling"
  - "performance-based"
  - "multi-year rate plan"
