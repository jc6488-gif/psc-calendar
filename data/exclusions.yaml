# Events the desk reviewed and does not want on the calendar.
#
# Committed to the repo on purpose: the .ics feeds are built server-side, so an
# exclusion only reaches Outlook once it is in here and the site rebuilds
# (~4 minutes after a push). Browser-side hiding could never do that.
#
# Tick rows on the dashboard ("Review mode"), press "Copy exclusions", then
# paste here using GitHub's own web editor - no terminal needed:
#   https://github.com/stellacc888/psc-calendar/edit/main/data/exclusions.yaml
# Two people reviewing different states merge cleanly - that is what git is for.
#
#   events:      drop ONE occurrence, matched on commission + date + exact title
#   recurring:   drop it EVERY time it appears, matched on a title substring
#
# Prefer `recurring` for anything that repeats: dropping a single instance of a
# monthly meeting is a decision you have to make again next month.
#
# The build reports entries that stop matching anything ("stale") - usually the
# commission retitled the event, which means what you hid is back. It also
# reports dated entries whose date has passed, which are safe to delete.
#
# Nothing here is required. An empty file publishes everything.

events:
  - commission: FL
    date: 2026-08-18
    title: Internal Affairs - Hearing immediately following
  - commission: FL
    date: 2026-08-18
    title: "Hearing: 20260087-EM (Day:1) — Petition for determination of need for a new combined cycle generating unit and onsite associated facilities located at St. Johns River Power Park Unit 3 in Duval County, by JEA"
  - commission: GA
    date: 2026-08-18
    title: Administrative Session 8-18-2026
  - commission: IL
    date: 2026-08-18
    title: Illinois Commerce Commission Hearing for T26-0004
  - commission: IL
    date: 2026-08-18
    title: Illinois Commerce Commission Hearing for T26-0005
  - commission: IL
    date: 2026-08-18
    title: Illinois Commerce Commission Prehearing for 26-0424
  - commission: ME
    date: 2026-08-18
    title: Deliberations Audio/Video
  - commission: OR
