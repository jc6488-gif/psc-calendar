    title: Docket ADV 1886 - IDAHO POWER ADVICE NO 26-09 REVISIONS TO SCHEDULE 95 ADJUST FOR MUNICIPAL EXACT PUBLIC MEETING HEARING ROOM - PUC 201 HIGH ST SE SALEM, OR

# Repeats every month? Use a recurring rule instead, so you
# only decide once:
# recurring:
#   - commission: FL
#     title_contains: Internal Affairs - Hearing immediately following
#   - commission: FL
#     title_contains: "Hearing: 20260087-EM (Day:1) — Petition for dete"

recurring: []
